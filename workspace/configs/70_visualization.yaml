# B2: візуалізація (Grad-CAM, RoI-ембедінги). Не тренує, читає ваги готових ранів; GPU ≈ кілька хвилин (Colab T4).
# Відсутні ваги = частина пропускається з повідомленням у log.txt. У SMOKE ваги беруться з results/_smoke/.
runner: visualization

frcnn_run: 10_frcnn_base       # Grad-CAM по FPN + RoI-ембедінги (замінити на найкращий з 1x)
rtdetr_run: 40_rtdetr_base     # Grad-CAM по входах декодера (замінити на найкращий з 4x)
n_frames: 4                    # кадрів val у кожній картинці Grad-CAM (рівномірно по val)
embed_frames: 40               # кадрів val для RoI-ембедінгів
embed_per_class: 150           # GT-рамок на клас (менше, якщо клас рідкісний)
tsne_perplexity: 30
display_side: 640              # довга сторона кадру на картинках
