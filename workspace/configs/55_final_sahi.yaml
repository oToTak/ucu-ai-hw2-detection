# T7, ефект інференсу 3 з 4: SAHI-нарізання (цілий кадр + тайли), злиття NMS як у статті SAHI. Міняється лише tricks.sahi
# і спосіб злиття. Без TTA.
# Кількість тайлів 1344 з перекриттям 0.2 (рахунок за EDA): val ≈ 13061 тайл на 2846 кадрів (кліп 3840x2160 дає 8 на кадр),
# test ≈ 6581 на 3811 кадрів.
# Тривалість (ОЦІНКА; тайл коштує один прохід 960x960, бо RT-DETR розтягує вхід у квадрат):
# val (2846 + 13061) проходів ≈ 22 хв, test (3811 + 6581) ≈ 14 хв, разом ≈ 0.7 год GPU.
extends: 50_final

tricks:
  sahi:
    enabled: true
  merge:
    method: nms
    iou_thr: 0.5