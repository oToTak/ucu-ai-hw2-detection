# B1 temporal: постобробка збережених передбачень (CPU, без GPU). Схема й параметри: src/temporal.py.
# Один ран перебирає сітку, пише temporal_grid.csv (кожна точка проти baseline без temporal на тому ж val)
# і застосовує найкращу точку до submission.csv того ж рану-джерела.
runner: temporal

source: 10_frcnn_base   # ПЛЕЙСХОЛДЕР: ран із повним preds_val.json.gz і submission.csv; справжній вибір після результатів 1x-4x
select: mAP             # за чим вибирати найкращу точку сітки

# Усі ключі списки; декартів добуток. Відсутні ключі беруть значення за замовчуванням із temporal.PARAMS.
# Кожна точка це повна оцінка 2846 кадрів val (≈хвилина CPU), тому сітку тримати малою.
grid:
  window: [1, 2]              # напівширина вікна згладжування, кадрів
  alpha: [0.3, 0.6]           # частка згладженого score
  short_penalty: [1.0, 0.7]   # множник для треків коротших за min_len (1.0 вимикає)
  prop_thr: [null, 0.5]       # null: без прокидання; 0.5: прокидати детекції зі score >= 0.5
