# T6 експеримент 1: кількість queries. 300 -> 150. EDA: об'єктів на кадр у train mean 46, median 43, p95 118,
# p99 142, max 180 (val max 116), тож 150 покриває p99 і майже max, а decoder дешевший. Діапазон: 100-500
# (<=500 = ліміт умови; топ-k по queries*класи не дасть більше nq детекцій на кадр).
# Тест не розмічений і може бути щільнішим за train: якщо 150 просяде на AP_small/recall, 300 лишається базою.
extends: 40_rtdetr_base

rtdetr:
  num_queries: 150
