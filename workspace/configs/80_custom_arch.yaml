# B3 абляція 1: 30_yolo_base + рівень детекції P2 (stride 4). Решта як у базі (extends).
# Шари 0-22 дослівно yolo11.yaml, тому ваги й P3-P5 ті самі; P2 лише top-down гілка з шарів 16 і 2.
# Порядок [P3, P4, P5, P2] навмисний (звірено з 8.4.203):
#   head.py: c3 = max(ch[0], nc), при P2 першим і ширині 64 класова гілка всіх рівнів стала б 64 замість 128;
#   tal.py:  stride_val = stride[1], при P2 першим підлога кандидатів стала б 8 замість 16.
# Вартість (рахунок вручну, не заміряно): 48.8 -> ≈66 GFLOPs при 960, якорів 18900 -> 76500. Оцінка ≈1.4x від 30.
# budget_minutes підняти, щоб сторож не обрізав епох: порівнювати можна лише при однакових epochs.
extends: 30_yolo_base
runner: models.custom
base: 30_yolo_base
budget_minutes: 105

experiment:
  change: "додано рівень детекції P2 (stride 4, 64 канали); P3-P5, ваги, епохи, batch, протокол без змін"
  why: "EDA: 73.5% об'єктів train малі після ресайзу до 960, медіана sqrt(площі) 22.8 px, p5 10.2 px, k-means якорі від 8x11 px; 24.0% об'єктів мають sqrt(площі) < 16 px, тобто менше за 2 клітинки P3"
  hypothesis: "AP_small зросте більше, ніж впаде fps; AP_large не зміниться; вартість менша за перехід на 1280 (31_yolo_imgsz)"

arch:
  name: yolo11s-p2      # ім'я файлу задає масштаб s (nn/tasks.py: guess_model_scale)
  nc: 80                # як у джерела ваг; 8 класів ставить тренер (DetectionModel(nc=...))
  scales:
    s: [0.50, 0.50, 1024]
  backbone:
    - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
    - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
    - [-1, 2, C3k2, [256, False, 0.25]]    # 2
    - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
    - [-1, 2, C3k2, [512, False, 0.25]]    # 4
    - [-1, 1, Conv, [512, 3, 2]]           # 5-P4/16
    - [-1, 2, C3k2, [512, True]]           # 6
    - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32
    - [-1, 2, C3k2, [1024, True]]          # 8
    - [-1, 1, SPPF, [1024, 5]]             # 9
    - [-1, 2, C2PSA, [1024]]               # 10
  head:
    - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
    - [[-1, 6], 1, Concat, [1]]                    # 12
    - [-1, 2, C3k2, [512, False]]                  # 13
    - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
    - [[-1, 4], 1, Concat, [1]]                    # 15
    - [-1, 2, C3k2, [256, False]]                  # 16 P3
    - [-1, 1, Conv, [256, 3, 2]]                   # 17
    - [[-1, 13], 1, Concat, [1]]                   # 18
    - [-1, 2, C3k2, [512, False]]                  # 19 P4
    - [-1, 1, Conv, [512, 3, 2]]                   # 20
    - [[-1, 10], 1, Concat, [1]]                   # 21
    - [-1, 2, C3k2, [1024, True]]                  # 22 P5
    - [16, 1, nn.Upsample, [None, 2, "nearest"]]   # 23 нове
    - [[-1, 2], 1, Concat, [1]]                    # 24 нове
    - [-1, 2, C3k2, [128, False]]                  # 25 нове, P2
    - [[16, 19, 22, 25], 1, Detect, [nc]]          # 26
