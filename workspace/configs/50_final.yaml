# T7, ефект ІНФЕРЕНСУ. Базова точка: ті самі ваги 41_rtdetr_queries, один прохід по цілому кадру, без трюків.
# Усі рани ефекту інференсу (51, 52, 55, 56) роблять `extends: 50_final` і міняють один блок tricks.
# Навіщо рахувати базу, якщо метрики 41 уже є: це той самий код (TrickPredictor з одним джерелом = Predictor),
# тож mAP має збігтися з 41_rtdetr_queries; розбіжність означає помилку в runner final. Заодно дає submission.csv.
# Тривалість (ОЦІНКА, не вимірювання; RT-DETR 960, fps 12 з metrics 41): val 2846 + test 3811 кадрів
# ≈ 6657 проходів ≈ 9 хв + оцінка й fps ≈ 0.2 год GPU.
runner: final

weights_from: 41_rtdetr_queries   # ваги best.pt цього рану (на Colab у RESULTS, у SMOKE із _smoke/ або, якщо їх немає, з RESULTS)
# model_weights: [1.0, 1.0]       # ваги моделей у WBF, якщо weights_from список (ансамбль)
val_full: true                    # повний val (2846 кадрів); false: кожен val_step-й кадр
predict_test: true

tricks:
  tta:
    enabled: false
    flip: true                    # горизонтальний флип
    scales: [1.0]                 # множники довгої сторони входу; 1.0 це прохід по цілому кадру
  sahi:
    enabled: false
    slice_size: 1344              # сторона тайла в пікселях оригіналу. 1344 це 960 / 0.714, тобто найбільший масштаб
                                  # кадр->вхід, що був у train (EDA: 0.35-0.71): тайл іде на вхід моделі в масштабі
                                  # train, а кадр 3840 (val, масштаб 0.25, об'єкти ~12 px) збільшується втричі
    overlap: 0.2
    slice_imgsz: null             # null: тайл іде на вхід моделі з її imgsz (960)
    edge_px: 3                    # рамки, що впираються у внутрішній край тайла, відкидаються
    tile_batch: 16
    pre_nms: 5000
    nms_iou: 0.5                  # NMS між тайлами одного кадру
    nms_metric: iou               # iou | ios
    source_max_det: 1000
  merge:
    method: wbf                   # wbf | nms | soft_nms
    iou_thr: 0.6                  # wbf: поріг збігу зі злитою рамкою; nms: поріг придушення
    skip_box_thr: 0.0
    conf_type: avg                # wbf: avg | max
    nms_metric: iou
    soft_method: gaussian         # soft_nms: gaussian | linear
    sigma: 0.5
    linear_iou_thr: 0.3
    score_thr: 0.001