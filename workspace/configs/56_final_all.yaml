# T7, комбінація: TTA флип + SAHI-тайли, злиття WBF за статтею. Міняє tricks.tta і tricks.sahi проти 50_final;
# разом із 51 і 55 розкладає внесок кожного трюка. Масштабний TTA (scales > 1) не вмикаю: нічого не перевірено
# на RT-DETR, а коштує +1.56 проходу за кожен масштаб 1.25.
# Джерел злиття три: цілий кадр, дзеркальний кадр, тайли.
# weights_from за замовчуванням 41. ЯКЩО 53 чи 54 виявляться кращими, змінити weights_from тут (ран іде в черзі останнім).
# Тривалість (ОЦІНКА): val (2 x 2846 + 13061) ≈ 26 хв, test (2 x 3811 + 6581) ≈ 20 хв, WBF на CPU ≈ 10 хв,
# разом ≈ 1 год GPU.
extends: 50_final

tricks:
  tta:
    enabled: true
  sahi:
    enabled: true