# T7, комбінація: TTA флип + SAHI-тайли, злиття WBF за статтею. Міняє tricks.tta і tricks.sahi проти 50_final;
# разом із 51 і 55 розкладає внесок кожного трюка. Масштабний TTA (scales > 1) не вмикаю: нічого не перевірено
# на RT-DETR, а коштує +1.56 проходу за кожен масштаб 1.25.
# Джерел злиття три: цілий кадр, дзеркальний кадр, тайли.
# Модель 54_rtdetr_1280: найкращий step-val (0.2708 проти 0.2545 у 41 на тих самих кадрах), 53 гірший за 41 (0.2300).
# Вхід 1280 береться з конфігу 54. Тайл 1344 при вході 1280 дає масштаб 0.95, тобто найбільший масштаб train для 1280.
# Тривалість (ОЦІНКА за фактом 51 і 55 на 41: 31 і 49 хв): на 960 ≈ 1.1 год, на 1280 x1.78 ≈ 2 год GPU.
extends: 50_final

tricks:
  tta:
    enabled: true
  sahi:
    enabled: true
weights_from: 54_rtdetr_1280
