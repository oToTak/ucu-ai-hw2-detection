# Зворотне логування готових ранів у W&B (src/wandb_backfill.py). Потрібен WANDB_API_KEY (Colab Secrets).
# Не тренує, CPU, хвилини. Повторний запуск оновлює ті самі W&B-рани (id bf-<run_id>), дублікатів немає.
runner: wandb_backfill

runs:                          # null = усі готові рани за run_prefixes мінус exclude_runners; або явний список
run_prefixes: ["0", "1", "2", "3", "4", "5", "8"]   # детектори 0x-5x і 8x
exclude_runners: [compare, summary, eda, visualization, wandb_backfill, temporal]
n_frames: 8                    # кадрів val із рамками на ран, рівномірно по val
score_thr: 0.3                 # поріг score для передбачених рамок
display_side: 960              # довга сторона кадру
