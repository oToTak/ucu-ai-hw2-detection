# T7, ефект МОДЕЛІ 2 з 2: те саме, що 53, але imgsz 1280 (YOLO 960 -> 1280 дав mAP +16 %, AP_small +37 %).
# RT-DETR розтягує кадр у квадрат imgsz x imgsz: 1280 це 1.78x пікселів проти 960.
# Епоха ≈ 37 хв (ОЦІНКА: 21 x 1.78 при batch 4). Після 2-ї епохи 74 + 37 = 111 хв <= budget 150 - reserve 12.
# imgsz тече з конфігу в train, у кеш залитих кадрів (cache_max_side) і в Predictor; rtdetr.py його не чіпає.
# Ризик пам'яті: batch 4 при 1280x1280 не перевірявся. Якщо OOM: batch: 2 (nbs: 16 лишає ефективний батч, акумуляція зросте).
# eval_batch зменшено до 2: інференс у колбеку йде поруч із пам'яттю тренера.
# Тривалість (ОЦІНКА): 3 x 37 = 111 хв тренування + повний val, test і fps ≈ 15 хв ≈ 2.1 год GPU.
extends: 53_rtdetr_sched

imgsz: 1280
budget_minutes: 150
eval_batch: 2