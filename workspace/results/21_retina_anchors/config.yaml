seed: 42
imgsz: 960
frame_step: 3
val_step: 5
mask_ignore: true
ignore_fill: 114
ignore_drop_ioa: 0.5
num_workers: 2
budget_minutes: 75
ckpt_sync_minutes: 15
conf: 0.001
max_det: 500
eval_batch: 8
fps_frames: 100
predict_test: true
smoke_limits:
  train_clips: 2
  train_frames: 64
  val_clips: 2
  val_frames: 30
  test_clips: 2
  test_frames: 8
  fps_frames: 5
  epochs: 1
  max_iters: 20
runner: models.retina
model:
  trainable_backbone_layers: 3
  kwargs:
    fg_iou_thresh: 0.5
    bg_iou_thresh: 0.4
    nms_thresh: 0.5
    topk_candidates: 1000
  focal:
    alpha: 0.25
    gamma: 2.0
  anchors:
    wh:
    - - 8.1
      - 11.1
    - - 10.1
      - 20.4
    - - 16.6
      - 14.6
    - - 14.6
      - 28.7
    - - 22.2
      - 23.6
    - - 31.3
      - 17.1
    - - 29.2
      - 40.0
    - - 48.4
      - 26.7
    - - 75.7
      - 55.0
    per_level: 3
    extra_levels_scale:
    - 2.0
    - 4.0
train:
  epochs: 4
  batch_size: 4
  lr: 0.0025
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 300
  final_lr_frac: 0.01
  grad_clip: 10.0
  amp: true
  hflip: 0.5
  log_every: 100
  reserve_minutes: 12
run_id: 21_retina_anchors
