seed: 42
imgsz: 960
frame_step: 3
val_step: 5
mask_ignore: true
ignore_fill: 114
ignore_drop_ioa: 0.5
num_workers: 2
budget_minutes: 75
ckpt_sync_minutes: 15
conf: 0.001
max_det: 500
eval_batch: 8
fps_frames: 100
predict_test: true
smoke_limits:
  train_clips: 2
  train_frames: 64
  val_clips: 2
  val_frames: 30
  test_clips: 2
  test_frames: 8
  fps_frames: 5
  epochs: 1
  max_iters: 20
runner: models.frcnn
model:
  trainable_backbone_layers: 3
  anchor_sizes:
  - 16
  - 32
  - 64
  - 128
  - 256
  kwargs:
    rpn_pre_nms_top_n_train: 2000
    rpn_post_nms_top_n_train: 2000
    rpn_pre_nms_top_n_test: 1000
    rpn_post_nms_top_n_test: 1000
    rpn_nms_thresh: 0.7
    box_nms_thresh: 0.5
    box_fg_iou_thresh: 0.5
    box_bg_iou_thresh: 0.5
    box_batch_size_per_image: 512
    box_positive_fraction: 0.5
train:
  epochs: 4
  batch_size: 4
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 300
  final_lr_frac: 0.01
  grad_clip: 10.0
  amp: true
  hflip: 0.5
  log_every: 100
  reserve_minutes: 12
failure:
  score_thr: 0.3
  iou_thr: 0.5
  examples: 6
run_id: 12_frcnn_loss
